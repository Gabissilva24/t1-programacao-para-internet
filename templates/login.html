{% extends 'base_publica.html' %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">Login</h2>
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" id="senha" placeholder="Sua senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
                </form>
                <hr class="my-4">
                <div class="text-center">
                    <small>Não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
