{% extends 'base.html' %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-people"></i> Gerenciamento de Usuários</h2>
    <a href="{{ url_for('inserir_usuario') }}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Novo Usuário
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover table-bordered mb-0">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Tipo/Cargo</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for item in lista %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.nome }}</td>
                    <td>{{ item.email }}</td>
                    <td><span class="badge bg-info text-dark">{{ item.tipo }}</span></td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-warning">Editar</button>
                        <button class="btn btn-sm btn-danger" onclick="confirmarExclusao('{{ item.nome }}')">Excluir</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function confirmarExclusao(nome) {
        if (confirm("Tem certeza que deseja excluir o usuário " + nome + "?")) {
            alert("Simulação: Usuário excluído com sucesso!");
        }
    }
</script>
{% endblock %}
