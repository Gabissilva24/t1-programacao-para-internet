{% extends 'base.html' %}
<!-- Usa o layout base do sistema (geralmente com menu, navbar...) -->

{% block conteudo %}
<!-- Início do conteúdo da página -->

<div class="row justify-content-center">
    <div class="col-md-6">

        <!-- Card (caixinha do formulário) -->
        <div class="card shadow border-0">

            <!-- Cabeçalho -->
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> Cadastrar Novo Usuário</h4>
            </div>

            <!-- Corpo -->
            <div class="card-body p-4">

                <!-- Formulário que envia dados para a rota 'inserir_usuario' -->
                <form action="{{ url_for('inserir_usuario') }}" method="POST">
                    
                    <!-- Campo Nome -->
                    <div class="mb-3">
                        <label for="nome" class="form-label fw-bold">Nome Completo</label>
                        
                        <!-- name="nome" será usado no Flask -->
                        <input type="text" name="nome" id="nome" class="form-control" placeholder="Digite o nome do usuário" required>
                        
                        <!-- Texto de ajuda -->
                        <div class="form-text">Campo obrigatório.</div>
                    </div>

                    <div class="mb-3">
                        <label for="cpf" class="form-label fw-bold">CPF</label>
                        <input type="text" name="cpf" id="cpf" class="form-control" value="{{ item.cpf if item else '' }}" placeholder="000.000.000-00" required>
                    </div>

                    <!-- Campo Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">E-mail</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="exemplo@cine.com" required>
                    </div>

                    <!-- Campo Função -->
                    <div class="mb-3">
                        <label for="funcao" class="form-label fw-bold">Função</label>
                        <select name="funcao" id="funcao" class="form-select">
                            <option value="">Selecione uma função</option>
                            {% for f in lista_funcoes %}
                                <option value="{{ f.id_funcao }}">{{ f.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="funcao" class="form-label fw-bold">Status</label>
                        <select name="status" id="status" class="form-select">
                            <option value="Ativo" {{ 'selected' if not item or item.status == 'Ativo' else '' }}>Ativo</option>
                            <option value="Inativo" {{ 'selected' if item and item.status == 'Inativo' else '' }}>Inativo</option>
                        </select>
                    </div>

                    <!-- Campo Senha -->
                    <div class="mb-4">
                        <label for="senha" class="form-label fw-bold">Senha</label>
                        <!-- Campo de senha (oculto ao digitar) -->
                        <input type="password" name="senha" id="senha" class="form-control" placeholder="Mínimo 8 caracteres" {{ 'required' if not item else '' }}>
                    </div>

                    <!-- Campo Confirmar Senha -->
                    <div class="mb-4">
                        <label for="senha" class="form-label fw-bold">Confirmar Senha</label>
                        <input type="password" name="confirmar_senha" id="confirmar_senha" class="form-control" placeholder="Repita a senha" {{ 'required' if not item else '' }}>
                    </div>

                    <!-- Botões -->
                    <div class="d-grid gap-2">

                        <!-- Botão que envia o formulário -->
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Salvar Usuário
                        </button>

                        <!-- Botão para voltar para lista de usuários -->
                        <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
<!-- Fim do conteúdo -->

<!-- Esse é o formulário de cadastro de usuário dentro do sistema (área logada): é a tela de criar novo usuário -->
