{% extends 'base_publica.html' %}
<!-- Usa um layout base (tipo um molde da página) -->

{% block conteudo %}
<!-- Início do conteúdo que será inserido no layout -->

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0">

            <!-- Cabeçalho do card -->
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Criar Nova Conta</h4>
            </div>

            <!-- Corpo do card (onde está o formulário) -->
            <div class="card-body p-4">

                <!-- Formulário que envia dados para a rota 'cadastro' usando POST -->
                <form action="{{ url_for('cadastro') }}" method="POST">

                     <!-- Campo Nome -->
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <!-- name="nome" é o que o Flask usa para pegar o valor -->
                        <input type="text" name="nome" id="nome" class="form-control" placeholder="Seu nome" required>
                    </div>

                    <!-- Campo Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="email@exemplo.com" required>
                    </div>

                    <!-- Campo Senha -->
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" name="senha" id="senha" class="form-control" placeholder="Crie uma senha" required>
                    </div>

                    <!-- Campo Confirmar Senha -->
                    <div class="mb-3">
                        <label for="confirma_senha" class="form-label">Confirme a Senha</label>
                        <input type="password" name="confirma_senha" id="confirma_senha" class="form-control" placeholder="Repita a senha" required>
                    </div>

                    <!-- Botões -->
                    <div class="d-grid gap-2">
                        <!-- Botão que envia o formulário -->
                        <button type="submit" class="btn btn-primary">Finalizar Cadastro</button>
                        <!-- Botão que volta para a página inicial -->
                        <a href="{{ url_for('index') }}" class="btn btn-light">Cancelar</a>
                    </div>
                </form>
            </div>

            <!-- Rodapé do card -->
            <div class="card-footer text-center py-3">
                <!-- Link para a página de login -->
                <p class="mb-0">Já tem uma conta? <a href="{{ url_for('login') }}" class="text-primary fw-bold">Faça Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
<!-- Fim do conteúdo -->

<!-- Herança (extends): Esta página utiliza o base_publica.html, pois o usuário ainda não está logado no sistema. -->

<!-- Método POST: O formulário usa o método POST. Isso é importante porque estamos enviando dados sensíveis (como a senha) que não devem aparecer na URL. -->

<!-- Atributo required: Coloquei o atributo required em todos os campos. Isso faz uma validação básica no próprio navegador, impedindo que o usuário envie o formulário vazio. -->

<!-- Bootstrap: Usei as classes shadow (sombra) e border-0 (sem bordas) para dar um aspecto mais moderno ao formulário. -->
