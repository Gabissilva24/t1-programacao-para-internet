{% extends 'base_publica.html' %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Criar Nova Conta</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('cadastro') }}" method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" name="nome" id="nome" class="form-control" placeholder="Seu nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="email@exemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" name="senha" id="senha" class="form-control" placeholder="Crie uma senha" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirma_senha" class="form-label">Confirme a Senha</label>
                        <input type="password" name="confirma_senha" id="confirma_senha" class="form-control" placeholder="Repita a senha" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Finalizar Cadastro</button>
                        <a href="{{ url_for('index') }}" class="btn btn-light">Cancelar</a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <p class="mb-0">Já tem uma conta? <a href="{{ url_for('login') }}" class="text-primary fw-bold">Faça Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
