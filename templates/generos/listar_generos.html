{% extends 'base.html' %}
<!-- Layout base do sistema -->

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-tags"></i> Categorias e Gêneros</h2>
    <a href="{{ url_for('inserir_genero') }}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Novo Gênero
    </a>
</div>

<div class="card shadow-sm border-0">

    <!-- Lista de gêneros (usando list-group ao invés de tabela) -->
    <div class="list-group list-group-flush">

        <!-- Loop que percorre os gêneros -->
        {% for genero in dados %}
        
        <div class="list-group-item p-4">
            <div class="d-flex w-100 justify-content-between align-items-center">
                
                <!-- Parte esquerda (ícone + informações) -->
                <div class="d-flex align-items-center">

                    <!-- Ícone -->
                    <div class="rounded-circle bg-primary bg-opacity-10 p-3 me-3">
                        <i class="bi bi-bookmark-star-fill text-primary fs-4"></i>
                    </div>

                    <!-- Nome e descrição -->
                    <div>
                        <h5 class="mb-1 fw-bold">{{ genero.nome }}</h5>
                        <p class="mb-1 text-muted">{{ genero.descricao }}</p>
                    </div>
                </div>

                <!-- Botões -->
                <div class="d-flex gap-2 justify-content-center">
                    <button class="btn btn-sm btn-warning rounded px-3">Editar</button>
                    <button class="btn btn-sm btn-danger rounded px-3" onclick="confirmarExclusao('{{ genero.nome }}')">Excluir</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function confirmarExclusao(nome) {
        if (confirm("Deseja realmente excluir o gênero: " + nome + "?")) {
            alert("Simulação: Gênero removido!");
        }
    }
</script>
{% endblock %}

<!-- No lugar de <table> utilizei <div class="list-group"></div>
    que é uma lista estilizada (Bootstrap), cada item é um “cardzinho” -->
