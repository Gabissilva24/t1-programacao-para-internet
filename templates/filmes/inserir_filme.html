{% extends 'base.html' %}
<!-- Usa o layout base do sistema -->

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Cadastrar Novo Filme</h4>
            </div>

            <!-- Corpo -->
            <div class="card-body p-4">

                <!-- Formulário para cadastrar um novo filme -->
                <form action="{{ url_for('inserir_filme') }}" method="POST">
                    
                    <!-- Campo título (obrigatório) -->
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-bold">Título do Filme</label>
                        <input type="text" name="titulo" id="titulo" class="form-control" placeholder="Ex: O Auto da Compadecida" required>
                        <div class="form-text">Campo obrigatório.</div>
                    </div>

                    <!-- Campo diretor (opcional) -->
                    <div class="mb-3">
                        <label for="diretor" class="form-label fw-bold">Diretor</label>
                        <input type="text" name="diretor" id="diretor" class="form-control" placeholder="Nome do Diretor">
                    </div>

                     <!-- Linha com dois campos lado a lado -->
                    <div class="row">

                        <!-- Campo ano (somente números) -->
                        <div class="col-md-6 mb-3">
                            <label for="ano" class="form-label fw-bold">Ano de Lançamento</label>
                            <input type="number" name="ano" id="ano" class="form-control" placeholder="Ex: 2000">
                        </div>

                        <!-- Seleção de gênero -->
                        <div class="col-md-6 mb-3">
                            <label for="genero" class="form-label fw-bold">Gênero</label>
                            
                            <!-- Select com opções pré-definidas -->
                            <select name="genero" id="genero" class="form-select">
                                <option value="Comédia">Comédia</option>
                                <option value="Terror">Terror</option>
                                <option value="Aventura">Aventura</option>
                                <option value="Suspense">Suspense</option>
                                <option value="Animação">Animação</option>
                            </select>
                        </div>
                    </div>

                    <!-- Botões de ação -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-save"></i> Salvar Filme
                        </button>
                        <a href="{{ url_for('listar_filmes') }}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
