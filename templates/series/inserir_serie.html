{% extends 'base.html' %}
<!-- Layout base do sistema -->

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">

        <!-- Card do formulário -->
        <div class="card shadow border-0">

            <!-- Cabeçalho -->
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="bi bi-tv"></i> Cadastrar Nova Série</h4>
            </div>

            <!-- Corpo -->
            <div class="card-body p-4">

                <!-- Formulário que envia dados para inserir série -->
                <form action="{{ url_for('inserir_serie') }}" method="POST">
                    
                    <!-- Campo título -->
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-bold">Título da Série</label>
                        <input type="text" name="titulo" id="titulo" class="form-control" placeholder="Ex: Stranger Things" required>
                        <div class="form-text">Campo obrigatório.</div>
                    </div>

                    <!-- Linha com dois campos lado a lado -->
                    <div class="row">

                        <!-- Campo número de temporadas -->
                        <div class="col-md-6 mb-3">
                            <label for="temporadas" class="form-label fw-bold">Temporadas</label>
                            <input type="number" name="temporadas" id="temporadas" class="form-control" placeholder="Ex: 4" required>
                        </div>

                        <!-- Plataforma onde assistir -->
                        <div class="col-md-6 mb-3">
                            <label for="plataforma" class="form-label fw-bold">Onde Assistir</label>
                            <input type="text" name="plataforma" id="plataforma" class="form-control" placeholder="Ex: Netflix">
                        </div>
                    </div>

                    <!-- Botões -->
                    <div class="d-grid gap-2 mt-4">

                        <!-- Envia o formulário -->
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-save"></i> Salvar Série
                        </button>

                        <!-- Volta para listagem -->
                        <a href="{{ url_for('listar_series') }}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
