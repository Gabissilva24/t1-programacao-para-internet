{% extends 'base.html' %}

{% block conteudo %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow border-0">

            <!-- Cabeçalho -->
            <div class="card-header bg-dark text-white py-3">
                <h4 class="mb-0"><i class="bi bi-tv"></i> Editar Série</h4>
            </div>

            <!-- Corpo -->
            <div class="card-body p-4">

                <form action="{{ url_for('editar_serie', id=item.id_serie) }}" method="POST">

                    <!-- Campo Título -->
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-bold">Título</label>
                        <input type="text" name="titulo" id="titulo" class="form-control"
                               value="{{ item.titulo }}" placeholder="Digite o título da série" required>
                        <div class="form-text">Campo obrigatório.</div>
                    </div>

                    <!-- Campo Temporadas -->
                    <div class="mb-3">
                        <label for="temporadas" class="form-label fw-bold">Temporadas</label>
                        <input type="number" name="temporadas" id="temporadas" class="form-control"
                               value="{{ item.temporadas }}" min="0" placeholder="Número de temporadas">
                    </div>

                    <!-- Campo Plataforma -->
                    <div class="mb-3">
                        <label for="plataforma" class="form-label fw-bold">Plataforma</label>
                        <input type="text" name="plataforma" id="plataforma" class="form-control"
                               value="{{ item.plataforma or '' }}" placeholder="Ex: Netflix, Prime Video, HBO Max">
                    </div>

                    <!-- Campo Poster -->
                    <div class="mb-3">
                        <label for="poster" class="form-label fw-bold">Poster</label>
                        <input type="text" name="poster" id="poster" class="form-control"
                               value="{{ item.poster or '' }}" placeholder="Ex: nome_da_serie.jpg">
                        <div class="form-text">Nome do arquivo de imagem na pasta static/imgs. Opcional.</div>
                    </div>

                    <!-- Preview do poster atual -->
                    {% if item.poster %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Poster Atual</label>
                        <div>
                            <img src="{{ url_for('static', filename='imgs/' + item.poster) }}"
                                 alt="Poster atual"
                                 class="rounded shadow-sm"
                                 style="width: 80px; height: 110px; object-fit: cover;">
                        </div>
                    </div>
                    {% endif %}

                    <!-- Botões -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-check-circle"></i> Salvar Alterações
                        </button>
                        <a href="{{ url_for('listar_series') }}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
